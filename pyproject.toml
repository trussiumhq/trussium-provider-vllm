[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "trussium-provider-vllm"
version = "0.1.0"
description = "Trussium provider plugin for self-hosted vLLM deployments."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.28.0",
    "trussium>=0.59.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trussium_provider_vllm"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
